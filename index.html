<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vardiya Master | ANFA & KORSAV</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --p-bg: #f0f2f5; --p-header: #4895ef; --p-accent: #7209b7;
            --p-day: #f72585; --p-night: #4cc9f0; --p-off: #adb5bd;
            --p-text: #2b2d42; --p-card: #ffffff;
        }
        *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body{ font-family:'Poppins', sans-serif; background: var(--p-bg); color: var(--p-text); display:flex; flex-direction:column; align-items:center; max-width:500px; margin:auto; min-height:100vh; }

        /* Header */
        .header{ background: linear-gradient(135deg, #4cc9f0 0%, #4895ef 100%); padding:20px; border-radius:0 0 30px 30px; width:100%; box-shadow: 0 8px 20px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        #time { font-size: 1.8rem; color: white; font-weight: 700; line-height: 1; }
        #date { font-size: 0.8rem; color: white; opacity: 0.9; }
        .brand-badge { font-size: 0.7rem; color: white; font-weight: bold; background: rgba(0,0,0,0.15); padding: 4px 10px; border-radius: 8px; margin-top: 8px; display: inline-block; }
        
        .main-content{ width:100%; padding: 15px; display:flex; flex-direction:column; gap: 15px; }
        .section{ background: var(--p-card); padding:20px; border-radius:25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        /* PWA Yükle Butonu - ANA EKRAN */
        #pwa-main-btn { display:none; background: #2b2d42; color: white; padding: 15px; border-radius: 20px; text-align: center; font-weight: 700; border: none; cursor: pointer; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-5px);} 60% {transform: translateY(-3px);} }

        .v-row { display: flex; gap: 8px; }
        .vardiya-btn { flex: 1; background: #e9ecef; border: none; border-radius: 12px; padding: 12px 0; font-weight: 700; cursor: pointer; color: #6c757d; }
        .vardiya-btn.active { background: var(--p-header); color: white; box-shadow: 0 4px 12px rgba(72,149,239,0.3); }

        .calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top: 15px;}
        .day{ border-radius:8px; padding:10px 0; font-size:.8rem; text-align:center; font-weight: 600; background: #f8f9fa; color: #adb5bd; }
        .work-day{ background: var(--p-day) !important; color:white !important; }
        .work-night{ background: var(--p-night) !important; color:white !important; }
        .today { border: 2.5px solid var(--p-text) !important; color: var(--p-text); }

        /* Popups */
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center; backdrop-filter: blur(8px); }
        .popup { background: #f8f9fc; width: 92%; max-height: 85%; border-radius: 30px; padding: 25px 20px; text-align: center; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; color: #adb5bd; }
        .sub-menu-btn { width: 100%; background: white; border: none; padding: 15px; border-radius: 15px; margin-bottom: 10px; text-align: left; font-weight: 600; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); color: var(--p-text); }

        .info-card { background: white; padding: 12px; border-radius: 15px; border-left: 5px solid var(--p-header); margin-bottom: 10px; text-align: left; box-shadow: 0 3px 8px rgba(0,0,0,0.05); }
        .info-card b { display: block; color: var(--p-header); font-size: 0.85rem; }
        .info-card span { font-size: 0.75rem; color: #555; }

        .fancy-text { font-family: 'Caveat', cursive; color: var(--p-accent); }
    </style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div>
            <div id="date">Yükleniyor...</div>
            <div id="time">00:00</div>
            <div class="brand-badge">ANFA GÜVENLİK | KORSAV</div>
        </div>
        <button onclick="openPopup('pop-settings')" style="background:rgba(255,255,255,0.2); border:none; color:white; width:45px; height:45px; border-radius:15px; font-size:1.3rem; cursor:pointer;">⚙️</button>
    </div>
</div>

<div class="main-content">
    <div id="intro-box" class="section" style="display: none; border-left: 8px solid var(--p-header);">
        <h4 style="color:var(--p-header)">Değerli Mesai Arkadaşımız,</h4>
        <p style="font-size:0.85rem; margin:10px 0; line-height:1.4;">Uygulama hiçbir kişisel veriyi kaydetmez. ANFA personeli için özel geliştirilmiştir.</p>
        <label style="font-size:0.75rem; color:#888;"><input type="checkbox" id="hide-intro"> Bir daha gösterme</label>
        <button onclick="closeIntro()" style="width:100%; margin-top:15px; padding:15px; background:var(--p-header); color:white; border:none; border-radius:15px; font-weight:bold;">SİSTEME GİRİŞ YAP</button>
    </div>

    <button id="pwa-main-btn" onclick="installApp()">📲 UYGULAMAYI TELEFONA YÜKLE</button>

    <div class="v-row">
        <button class="vardiya-btn" id="btn-v1" onclick="setVardiya(1)">V1</button>
        <button class="vardiya-btn" id="btn-v2" onclick="setVardiya(2)">V2</button>
        <button class="vardiya-btn" id="btn-v3" onclick="setVardiya(3)">V3</button>
        <button class="vardiya-btn" id="btn-v4" onclick="setVardiya(4)">V4</button>
    </div>

    <div class="section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <button class="vardiya-btn" style="max-width:40px" onclick="changeMonth(-1)">❮</button>
            <b id="monthTitle" style="font-size: 1rem;">...</b>
            <button class="vardiya-btn" style="max-width:40px" onclick="changeMonth(1)">❯</button>
        </div>
        <div class="calendar-grid" id="calendar"></div>
    </div>
</div>

<div class="overlay" id="pop-settings">
    <div class="popup">
        <span class="close-btn" onclick="closePopup('pop-settings')">×</span>
        <h3 style="margin-bottom:20px;">MENÜ</h3>
        <button class="sub-menu-btn" onclick="openPopup('pop-izin')">📊 İzin Hesapla <span>➔</span></button>
        <button class="sub-menu-btn" onclick="openPopup('pop-haklar')">📜 KORSAV Hakları <span>➔</span></button>
        <button class="sub-menu-btn" onclick="openPopup('pop-renk')">🎨 Renk Ayarları <span>➔</span></button>
        <button class="sub-menu-btn" onclick="openPopup('pop-about')">ℹ️ Hakkında <span>➔</span></button>
    </div>
</div>

<div class="overlay" id="pop-izin">
    <div class="popup">
        <span class="close-btn" onclick="closePopup('pop-izin')">×</span>
        <h3>İzin Hesaplayıcı</h3>
        <p style="font-size:0.75rem; color:#666; margin:10px 0;">Pazar ve Resmi Tatiller dahil edilmez.</p>
        <input type="date" id="izin-start" style="width:100%; padding:15px; border-radius:15px; border:1px solid #ddd; margin-bottom:10px;">
        <input type="number" id="izin-sure" placeholder="Gün Sayısı" value="14" style="width:100%; padding:15px; border-radius:15px; border:1px solid #ddd; margin-bottom:15px;">
        <button onclick="hesaplaIzin()" style="width:100%; padding:18px; background:var(--p-header); color:white; border:none; border-radius:15px; font-weight:bold;">HESAPLA</button>
        <div id="izin-sonuc" style="margin-top:20px; padding:15px; background:white; border-radius:15px; display:none; border:1px solid #eee; text-align:left;"></div>
    </div>
</div>

<script>
let deferredPrompt;
const pwaBtn = document.getElementById('pwa-main-btn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Eğer intro kapalıysa butonu hemen göster
    if(localStorage.getItem('introClosed')) pwaBtn.style.display = 'block';
});

async function installApp() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') pwaBtn.style.display = 'none';
    deferredPrompt = null;
}

function closeIntro() {
    if(document.getElementById('hide-intro').checked) localStorage.setItem('introClosed', 'true');
    document.getElementById('intro-box').style.display = 'none';
    if(deferredPrompt) pwaBtn.style.display = 'block';
}

// İzin Hesaplama (KESİN ÇÖZÜM)
function hesaplaIzin() {
    const startVal = document.getElementById('izin-start').value;
    const gun = parseInt(document.getElementById('izin-sure').value);
    if(!startVal || isNaN(gun)) return alert("Tarih ve gün gir!");

    let curr = new Date(startVal);
    let count = 0;
    
    // İzin günlerini say (Pazar ve Tatilleri atla)
    while(count < gun) {
        let isSun = curr.getDay() === 0;
        let hKey = curr.getMonth() + "-" + curr.getDate();
        let hYearKey = curr.getFullYear() + "-" + curr.getMonth() + "-" + curr.getDate();
        let isHol = tatiller[hKey] || tatiller[hYearKey];

        if(!isSun && !isHol) {
            count++;
        }
        if(count < gun) curr.setDate(curr.getDate() + 1);
    }

    // Dönüş tarihi (Bitişten sonraki ilk iş günü)
    let donus = new Date(curr);
    donus.setDate(donus.getDate() + 1);
    while(donus.getDay() === 0 || tatiller[donus.getMonth() + "-" + donus.getDate()] || tatiller[donus.getFullYear() + "-" + donus.getMonth() + "-" + donus.getDate()]) {
        donus.setDate(donus.getDate() + 1);
    }

    const res = document.getElementById('izin-sonuc');
    res.style.display = 'block';
    res.innerHTML = `
        <b style="color:var(--p-day)">İzin Bitiş:</b> ${curr.toLocaleDateString('tr-TR', {weekday:'long', day:'numeric', month:'long'})}<br>
        <b style="color:var(--p-header)">İş Başı:</b> ${donus.toLocaleDateString('tr-TR', {weekday:'long', day:'numeric', month:'long'})}
    `;
}

// Takvim Verileri (2026-2030)
const tatiller = {
    "0-1":"Yılbaşı", "3-23":"23 Nisan", "4-1":"1 Mayıs", "4-19":"19 Mayıs", "6-15":"15 Temmuz", "7-30":"30 Ağustos", "9-29":"29 Ekim",
    "2026-2-20":"Ramazan Bayramı", "2026-4-27":"Kurban Bayramı", "2027-2-10":"Ramazan Bayramı", "2027-4-16":"Kurban Bayramı",
    "2028-1-29":"Ramazan Bayramı", "2028-4-4":"Kurban Bayramı", "2029-1-18":"Ramazan Bayramı", "2029-3-24":"Kurban Bayramı",
    "2030-1-7":"Ramazan Bayramı", "2030-3-14":"Kurban Bayramı"
};

// Takvim ve Vardiya Çizim Kodları...
let curYear = 2026, curMonth = new Date().getMonth();
let currentV = parseInt(localStorage.getItem('vSelection')) || 1;

function getV(date) {
    const ref = new Date(2026, 2, 11);
    const diff = Math.floor((date - ref) / 86400000);
    const cycle = (diff % 4 + 4) % 4;
    return [['off','off','day','night'],['off','day','night','off'],['day','night','off','off'],['night','off','off','day']][cycle];
}

function setVardiya(v) {
    currentV = v; localStorage.setItem('vSelection', v);
    document.querySelectorAll('.vardiya-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-v'+v).classList.add('active'); draw();
}

function draw() {
    const cal = document.getElementById('calendar'); cal.innerHTML = '';
    const first = (new Date(curYear, curMonth, 1).getDay() + 6) % 7;
    const daysCount = new Date(curYear, curMonth + 1, 0).getDate();
    document.getElementById('monthTitle').innerText = new Date(curYear, curMonth).toLocaleDateString('tr-TR',{month:'long', year:'numeric'}).toUpperCase();
    for(let i=0; i<first; i++) cal.appendChild(document.createElement('div'));
    for(let i=1; i<=daysCount; i++) {
        const d = new Date(curYear, curMonth, i);
        const type = getV(d)[currentV-1];
        const div = document.createElement('div');
        div.className = 'day ' + (type==='day'?'work-day':type==='night'?'work-night':'');
        if(d.toDateString() === new Date().toDateString()) div.classList.add('today');
        div.innerText = i; cal.appendChild(div);
    }
}

function changeMonth(n) { curMonth += n; if(curMonth>11){curMonth=0;curYear++} if(curMonth<0){curMonth=11;curYear--} draw(); }
function openPopup(id) { document.getElementById(id).style.display = 'flex'; }
function closePopup(id) { document.getElementById(id).style.display = 'none'; }

setInterval(() => {
    const n = new Date();
    document.getElementById('time').innerText = n.toLocaleTimeString('tr-TR',{hour:'2-digit', minute:'2-digit'});
    document.getElementById('date').innerText = n.toLocaleDateString('tr-TR',{weekday:'long', day:'numeric', month:'long'});
}, 1000);

window.onload = () => {
    if(!localStorage.getItem('introClosed')) {
        document.getElementById('intro-box').style.display = 'block';
    } else if(deferredPrompt) {
        pwaBtn.style.display = 'block';
    }
    setVardiya(currentV);
};
</script>
</body>
</html>
