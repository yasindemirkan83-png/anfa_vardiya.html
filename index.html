<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vardiya Takip</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#4895ef">
<style>
:root{
  --p-bg: #f8f9fc;
  --p-header: #4895ef; /* Daha Canlı Mavi */
  --p-accent: #7209b7; /* Canlı Mor */
  --p-day: #f72585;    /* Canlı Pembe */
  --p-night: #4cc9f0;  /* Parlak Gök Mavisi */
  --p-off: #e0e1dd;    
  --p-text: #2b2d42;   
  --p-holiday: #fb8500; /* Belirgin Turuncu */
}
html, body{ height:100%; margin:0; padding:0; font-family:'Poppins', sans-serif; background: var(--p-bg); color: var(--p-text); overflow: hidden; }
body{ display:flex; flex-direction:column; align-items:center; max-width:500px; margin:auto; }

.header{ 
  background: linear-gradient(135deg, #4cc9f0, #4895ef); 
  padding:30px 15px; border-radius:0 0 35px 35px; text-align:center; width:100%; 
  box-shadow: 0 10px 20px rgba(72, 149, 239, 0.2); flex-shrink:0; position:relative;
}
#time{font-size:2.8rem; color:white; margin:0; font-weight:600; letter-spacing: -1px;}
#date{font-size:.9rem; color:white; opacity:0.95;}
#todayShift{margin-top:12px; font-size:.85rem; background:rgba(255,255,255,0.25); padding:6px 18px; border-radius:20px; color:white; display:inline-block; backdrop-filter: blur(5px);}

.settings-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.3); border: none; border-radius: 50%; width: 40px; height: 40px; color: white; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
.settings-btn:active { transform: scale(0.9); }

.main-content{ flex:1; width:100%; display:flex; flex-direction:column; align-items:center; overflow-y:auto; padding: 20px 0 100px 0; }
.section{ background: white; padding:20px; border-radius:25px; margin-bottom:15px; width:88%; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
.section-title{ color: var(--p-header); font-size:0.9rem; margin-bottom:15px; font-weight:600; text-align:center; text-transform: uppercase; letter-spacing: 1.5px;}

.vardiya-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.vardiya-btn {
  background: #f1f3f5; border: 2px solid transparent; border-radius: 18px; padding: 15px 5px;
  cursor: pointer; font-weight: 600; font-size: 0.95rem; color: var(--p-text); transition: 0.3s;
}
.vardiya-btn.active { background: white; border-color: var(--p-accent); color: var(--p-accent); box-shadow: 0 5px 15px rgba(114, 9, 183, 0.15); }

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{ border-radius:12px; padding:12px 0; font-size:.85rem; text-align:center; font-weight: 600; background: #f8f9fa; color: #adb5bd; transition: 0.2s; }
.work-day{background: var(--p-day) !important; color:white !important; box-shadow: 0 4px 10px rgba(247, 37, 133, 0.2);}
.work-night{background: var(--p-night) !important; color:white !important; box-shadow: 0 4px 10px rgba(76, 201, 240, 0.2);}
.off{background: #f1f3f5; color: #adb5bd;}
.today{ border: 2px solid var(--p-accent); color: var(--p-accent); position: relative;}
.today::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--p-accent); border-radius: 50%; }
.holiday-mark{ border-bottom: 3px solid var(--p-holiday); }

.holiday-card { background: #fff9f0; border-left: 5px solid var(--p-holiday); padding: 15px; border-radius: 18px; width: 88%; margin-bottom: 20px; display: none; }
.holiday-item { font-size: 0.85rem; margin-bottom: 5px; color: #5d4037; }

.overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; align-items:center; justify-content:center; backdrop-filter: blur(8px); }
.popup { background: white; width: 85%; max-width: 340px; border-radius: 30px; padding: 30px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
.qr-code { width: 150px; height: 150px; margin: 15px auto; display: block; border-radius: 15px; }
.handwritten { font-family: 'Dancing Script', cursive; font-size: 1.3rem; color: var(--p-accent); margin: 20px 0; }

.social-icons { display: flex; justify-content: center; gap: 30px; margin-top: 25px; }
.social-icons a { text-decoration: none; font-size: 1.8rem; transition: 0.3s; }

#announcement { 
    display:none; position:fixed; bottom:20px; width:85%; background: var(--p-accent); 
    color:white; padding:15px; border-radius:20px; z-index:3000; text-align:center; 
    font-size: 0.9rem; font-weight:600; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    cursor: pointer;
}
</style>
</head>
<body>

<div id="announcement" onclick="installPWA()">📲 Uygulamayı Ana Ekrana Ekle</div>

<div class="header">
  <button class="settings-btn" onclick="openPopup()">⚙️</button>
  <div id="date"></div>
  <div id="time"></div>
  <div id="todayShift"></div>
</div>

<div class="main-content">
  <div class="section">
    <div class="section-title">Vardiya Grubunu Seç</div>
    <div class="vardiya-buttons">
      <button class="vardiya-btn" data-v="1">1. Vardiya</button>
      <button class="vardiya-btn" data-v="2">2. Vardiya</button>
      <button class="vardiya-btn" data-v="3">3. Vardiya</button>
      <button class="vardiya-btn" data-v="4">4. Vardiya</button>
    </div>
  </div>

  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center; margin-bottom: 15px;">
      <button onclick="prevMonth()" style="border:none;background:none;font-size:1.4rem;color:var(--p-header);cursor:pointer">❮</button>
      <span id="monthTitle" style="font-weight:600; font-size: 1rem; color: var(--p-header);"></span>
      <button onclick="nextMonth()" style="border:none;background:none;font-size:1.4rem;color:var(--p-header);cursor:pointer">❯</button>
    </div>
    <div class="calendar-grid" id="calendar"></div>
  </div>

  <div class="holiday-card" id="holidayCard">
    <div style="font-weight: 600; color: var(--p-holiday); margin-bottom: 10px; font-size: 0.9rem;">📍 Önemli Günler</div>
    <div id="holidayList"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <h4 style="margin:0; color: var(--p-header);">Uygulama Bilgisi</h4>
    <img src="karekod.png" class="qr-code" alt="Karekod"> 
    
    <div class="handwritten">
      Bu uygulama sizin için Yasin Demirgan tarafından geliştirilmiştir.
    </div>

    <div class="social-icons">
      <a href="tel:05375120777">📞</a>
      <a href="https://wa.me/905375120777" target="_blank">💬</a>
      <a href="mailto:yasindemirkan83@gmail.com">✉️</a>
    </div>

    <button onclick="closePopup()" style="margin-top:25px; width: 100%; padding:12px; border:none; border-radius:15px; background: #eee; color:var(--p-text); font-weight:600; cursor:pointer;">Kapat</button>
  </div>
</div>

<script>
let secilen = localStorage.getItem('secilenVardiya') || 1;
let currentYear = new Date().getFullYear(), currentMonth = new Date().getMonth();
let deferredPrompt;

// PWA Yükleme Mantığı
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('announcement').style.display = 'block';
});

async function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') document.getElementById('announcement').style.display = 'none';
    deferredPrompt = null;
  }
}

// Bildirim İzni
if (Notification.permission !== 'granted') {
    Notification.requestPermission();
}

const tatiller = {
  "1-1":"🎉 Yılbaşı", "1-13":"🌙 Regaip Kandili", "2-2":"🌙 Miraç Kandili", "2-12":"🌙 Berat Kandili",
  "3-9":"🌙 Kadir Gecesi", "3-19":"🕌 Ramazan Arefe", "3-20":"🕌 Ramazan B. 1",
  "3-21":"🕌 Ramazan B. 2", "3-22":"🕌 Ramazan B. 3", "4-23":"🇹🇷 23 Nisan Çocuk B.",
  "5-1":"👷 1 Mayıs Emek", "5-19":"🇹🇷 19 Mayıs Gençlik", "5-26":"🐑 Kurban Arefe",
  "5-27":"🐑 Kurban B. 1", "5-28":"🐑 Kurban B. 2", "5-29":"🐑 Kurban B. 3",
  "5-30":"🐑 Kurban B. 4", "7-15":"🇹🇷 15 Temmuz Demokrasi", "8-30":"🇹🇷 30 Ağustos Zafer",
  "10-29":"🇹🇷 29 Ekim Cumhuriyet"
};

function vardiya(t){
  const gunFarki=Math.floor((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()) - Date.UTC(2026,0,1))/86400000)%4;
  const duzen=[['gece','izin','izin','gunduz'],['izin','izin','gunduz','gece'],['izin','gunduz','gece','izin'],['gunduz','gece','izin','izin']];
  return duzen[(gunFarki+4)%4];
}

function draw(){
  const calendar = document.getElementById('calendar');
  calendar.innerHTML=''; 
  const card = document.getElementById('holidayCard');
  const list = document.getElementById('holidayList');
  list.innerHTML = ''; card.style.display = 'none';

  const firstDay=(new Date(currentYear,currentMonth,1).getDay()+6)%7;
  const days=new Date(currentYear,currentMonth+1,0).getDate();
  const monthTitle = document.getElementById('monthTitle');
  monthTitle.innerText=new Date(currentYear,currentMonth).toLocaleDateString('tr-TR',{month:'long',year:'numeric'});

  for(let i=0;i<firstDay;i++) calendar.appendChild(document.createElement('div'));

  for(let i=1;i<=days;i++){
    const date=new Date(currentYear,currentMonth,i);
    const v=vardiya(date)[secilen-1];
    const d=document.createElement('div');
    const tKey = (currentMonth+1) + "-" + i;

    d.className='day '+(v==='gunduz'?'work-day':v==='gece'?'work-night':'off');
    if(date.toDateString()===new Date().toDateString()) d.classList.add('today');
    
    if(tatiller[tKey]){
      d.classList.add('holiday-mark');
      card.style.display = 'block';
      const dayName = date.toLocaleDateString('tr-TR', {weekday: 'short'});
      list.innerHTML += `<div class="holiday-item"><b>${i} ${monthTitle.innerText.split(' ')[0]} (${dayName}):</b> ${tatiller[tKey]}</div>`;
    }
    d.innerText=i; calendar.appendChild(d);
  }
  updateToday();
}

function updateToday() {
  const v = vardiya(new Date()); let g=[], n=[];
  v.forEach((x,i)=>{ if(x==='gunduz') g.push(i+1); if(x==='gece') n.push(i+1); });
  document.getElementById('todayShift').innerText = `Bugün → Gündüz: ${g.join(',')} | Gece: ${n.join(',')}`;
}

function openPopup() { document.getElementById('overlay').style.display = 'flex'; }
function closePopup() { document.getElementById('overlay').style.display = 'none'; }

document.querySelectorAll('.vardiya-btn').forEach(b=>{
  if(b.dataset.v == secilen) b.classList.add('active');
  b.onclick=()=>{
    document.querySelectorAll('.vardiya-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); secilen=b.dataset.v;
    localStorage.setItem('secilenVardiya', secilen); draw();
  }
});

function nextMonth(){currentMonth++;if(currentMonth>11){currentMonth=0;currentYear++}draw()}
function prevMonth(){currentMonth--;if(currentMonth<0){currentMonth=11;currentYear--}draw()}
function tick(){
  const n=new Date(); 
  document.getElementById('time').innerText=n.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('date').innerText=n.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
}

window.onload=()=>{ tick(); setInterval(tick,1000); draw(); };
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
