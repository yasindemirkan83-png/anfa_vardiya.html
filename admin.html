<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Vardiya Bildirim Admin</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f0f4f8;}
h2{color:#7f5af0;}
input, textarea, button{width:100%;margin-top:8px;padding:8px;border-radius:6px;border:1px solid #ccc;font-size:1rem;}
button{background:#7f5af0;color:white;border:none;cursor:pointer;font-weight:600;}
</style>
</head>
<body>
<h2>Bildirim Gönder</h2>

<input type="text" id="title" placeholder="Başlık" />
<textarea id="message" placeholder="Mesaj"></textarea>
<button onclick="sendNotification()">Gönder</button>

<script>
function sendNotification(){
  const title = document.getElementById('title').value.trim();
  const message = document.getElementById('message').value.trim();
  if(!title || !message){ alert('Başlık ve mesaj gerekli'); return; }

  const data = {
    title,
    message,
    timestamp: new Date().toISOString() // Tekrarlamaması için
  };

  // GitHub Pages statik olduğu için doğrudan yazamazsın
  // Bunun için:
  // 1. Dosyayı manuel upload edeceksin: bildirim.json
  // 2. Veya Netlify/Vercel gibi küçük bir serverless function kullanabilirsin
  alert('JSON dosyasını oluştur: \n' + JSON.stringify(data, null,2) + '\n\nBunu bildirim.json olarak deploy et.');
}
</script>
</body>
</html>
